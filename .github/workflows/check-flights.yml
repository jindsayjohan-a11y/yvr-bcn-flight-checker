name: Check flight prices

on:
  schedule:
    # Daily at 15:00 UTC (~8am Pacific)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check YVR → BCN prices
        id: prices
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_flights.py

      - name: Write job summary
        if: always()
        run: |
          if [ -f data/summary.md ]; then
            cat data/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary produced (check logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify if at/under CAD 1100
        if: steps.prices.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alert = JSON.parse(fs.readFileSync('data/alert.json', 'utf8'));
            if (!alert.alert) {
              core.info('No alert payload');
              return;
            }

            const label = 'price-alert';
            // Ensure label exists (ignore if already there)
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd73a4a',
                description: 'YVR→BCN fare at or under CAD 1100',
              });
            } catch (e) {
              // 422 = already exists
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: alert.body,
              });
              core.info(`Commented on existing alert issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: alert.title,
                body: alert.body,
                labels: [label],
              });
              core.info(`Opened alert issue #${issue.number}`);
            }

      - name: Upload price artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-prices-${{ github.run_id }}
          path: |
            data/latest.json
            data/summary.md
            data/history.jsonl
            data/alert.json
          if-no-files-found: ignore
          retention-days: 90
