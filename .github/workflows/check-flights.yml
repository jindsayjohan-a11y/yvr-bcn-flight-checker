name: Check flight prices

on:
  schedule:
    # As often as GitHub allows (~every 5 minutes; runs can be delayed under load)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check YVR → BCN flight prices
        id: prices
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: bcw3bcw3@gmail.com
        run: python check_flights.py

      - name: Check Barcelona hotel prices (landing + post-cruise)
        id: hotels
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: bcw3bcw3@gmail.com
        run: python check_hotels.py

      - name: Persist price history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.jsonl data/hotel_history.jsonl
          if git diff --staged --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "chore: update flight and hotel price history"
            git push
          fi

      - name: Write job summary
        if: always()
        run: |
          if [ -f data/summary.md ]; then
            cat data/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/hotel_summary.md ]; then
            cat data/hotel_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ! -f data/summary.md ] && [ ! -f data/hotel_summary.md ]; then
            echo "No summary produced (check logs)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on cabin price alerts
        if: steps.prices.outputs.alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alert = JSON.parse(fs.readFileSync('data/alert.json', 'utf8'));
            if (!alert.alert) {
              core.info('No alert payload');
              return;
            }

            const label = 'price-alert';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd73a4a',
                description: 'YVR→BCN fare under cabin thresholds',
              });
            } catch (e) {
              // 422 = already exists
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: alert.body,
              });
              core.info(`Commented on existing alert issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: alert.title,
                body: alert.body,
                labels: [label],
              });
              core.info(`Opened alert issue #${issue.number}`);
            }

      - name: Notify on hotel price alerts
        if: steps.hotels.outputs.hotel_alert == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const alert = JSON.parse(fs.readFileSync('data/hotel_alert.json', 'utf8'));
            if (!alert.alert) {
              core.info('No hotel alert payload');
              return;
            }

            const label = 'hotel-price-alert';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0075ca',
                description: 'Barcelona 4★+ hotel under CAD 200/night',
              });
            } catch (e) {
              // 422 = already exists
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 5,
            });

            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: alert.body,
              });
              core.info(`Commented on existing hotel alert issue #${issues[0].number}`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: alert.title,
                body: alert.body,
                labels: [label],
              });
              core.info(`Opened hotel alert issue #${issue.number}`);
            }

      - name: Upload price artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prices-${{ github.run_id }}
          path: |
            data/latest.json
            data/summary.md
            data/history.jsonl
            data/alert.json
            data/hotel_latest.json
            data/hotel_summary.md
            data/hotel_history.jsonl
            data/hotel_alert.json
          if-no-files-found: ignore
          retention-days: 90
